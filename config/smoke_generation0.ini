# Runtime configuration for TRIGA 2000 NSGA-II optimization with OpenMC.
[campaign]
# unique identifier for this optimization campaign
campaign_id = TRIGA2000_PUBLIC_FRESH_SMOKE
# root directory for simulation results
run_root = results

[paths]
# input files resolved against the project root by MainOptimizer
fuel_inventory_file = config/fuel_inventory.json
materials_file = config/materials.xml
# Runtime infrastructure path, resolved before checkpoint creation; remove this line only when PATH exposes openmc.
openmc_executable = openmc


[ga]
# genetic algorithm used for loading-pattern optimization
algorithm = NSGA-II
# fixed minimization objectives: (-keff, ppf_3d); no weights or normalization
# number of individuals in each population
population_size = 2
# maximum number of generations
num_generations = 1
# Maximum selected parent pairs per unique offspring batch; exhaustion aborts before transport.
max_reproduction_attempts = 10000
# true: reject/resample duplicate offspring; false: accept parent clones and
# reuse fitness only when the complete evaluation context is identical.
resample_duplicate_offspring = true
# random seed for reproducibility
random_seed = 20260908

[initial_population_percentages]
# Initial population is generated without a reference loading pattern.
# The percentages below must be non-negative and sum to 100.
low_leakage = 15
out_in = 15
center_relief = 14
ring_sector_balanced = 14
three_color_scatter = 14
stratified_random = 14
uniform_random = 14

[selection]
# standard NSGA-II parent selection method
method = crowded_binary_tournament
# number of individuals compared in each tournament
tournament_size = 2

[crossover]
# implemented crossover operator selected through the runtime registry
method = pmx
# probability that crossover is applied to a selected parent pair
probability = 0.90
# triga_hcmx_power_mask additionally requires mask_size_min, mask_size_max,
# selection_alpha, epsilon, nonfuel_policy, require_parent_power_tally,
# and require_convergence_passed; ConfigLoader rejects them while PMX is active

[mutation]
# mutation operator for permutation genome
method = swap_mutation
# probability that an offspring undergoes mutation
probability_per_individual = 0.35
# number of gene swaps when mutation occurs
swaps_per_mutated_individual = 1

[replacement]
# NSGA-II elitist replacement
method = elitist_nondominated_sorting

[chromosome]
# GA genome representation; fixed/excluded positions are not stored here
encoding = included_position_based_fuel_permutation
# Must equal fuel pins + empty holes + movable irradiation tubes below
genome_length = 108
# physical genome length required by OpenMCModelBuilder
complete_genome_length = 127
# number of movable fuel pins
movable_pin_count = 108
# fuel pins available as alleles
# IMPORTANT: the unique ID count must equal movable_pin_count
fuel_pin_ids = fuel_900001, fuel_900002, fuel_900003, fuel_900004, fuel_900005, fuel_900006, fuel_900007, fuel_900008, fuel_900009, fuel_900010, fuel_900011, fuel_900012, fuel_900013, fuel_900014, fuel_900015, fuel_900016, fuel_900017, fuel_900018, fuel_900019, fuel_900020, fuel_900021, fuel_900022, fuel_900023, fuel_900024, fuel_900025, fuel_900026, fuel_900027, fuel_900028, fuel_900029, fuel_900030, fuel_900031, fuel_900032, fuel_900033, fuel_900034, fuel_900035, fuel_900036, fuel_900037, fuel_900038, fuel_900039, fuel_900040, fuel_900041, fuel_900042, fuel_900043, fuel_900044, fuel_900045, fuel_900046, fuel_900047, fuel_900048, fuel_900049, fuel_900050, fuel_900051, fuel_900052, fuel_900053, fuel_900054, fuel_900055, fuel_900056, fuel_900057, fuel_900058, fuel_900059, fuel_900060, fuel_900061, fuel_900062, fuel_900063, fuel_900064, fuel_900065, fuel_900066, fuel_900067, fuel_900068, fuel_900069, fuel_900070, fuel_900071, fuel_900072, fuel_900073, fuel_900074, fuel_900075, fuel_900076, fuel_900077, fuel_900078, fuel_900079, fuel_900080, fuel_900081, fuel_900082, fuel_900083, fuel_900084, fuel_900085, fuel_900086, fuel_900087, fuel_900088, fuel_900089, fuel_900090, fuel_900091, fuel_900092, fuel_900093, fuel_900094, fuel_900095, fuel_900096, fuel_900097, fuel_900098, fuel_900099, fuel_900100, fuel_900101, fuel_900102, fuel_900103, fuel_900104, fuel_900105, fuel_900106, fuel_900107, fuel_900108
# physical core positions retained in the 127-gene genome but excluded from GA crossover and mutation
excluded_positions = A1, D2, D5, D9, D13, D16, G1, G2, G7, G8, G10, G13, G17, G19, G20, G25, G26, G31, G32
# EMPTY and irradiation tubes are fixed; blank token lists are intentional
movable_irradiation_tube_count = 0
empty_hole_count = 0
empty_hole_tokens =
movable_irradiation_tube_tokens =

[excluded_genes]
# fixed genes inserted by GenomeSorter before OpenMC model construction
A1 = irradiation_tube, IT
D2 = ffcr, fuel_900109
D5 = control_rod, CR
D9 = control_rod, CR
D13 = ffcr, fuel_900110
D16 = ffcr, fuel_900111
G1 = support_structure, X
G2 = empty_hole, EMPTY_1
G7 = support_structure, X
G8 = empty_hole, EMPTY_2
G10 = irradiation_tube, IT_1
G13 = support_structure, X
G17 = irradiation_tube, IT_2
G19 = support_structure, X
G20 = empty_hole, EMPTY_3
G25 = support_structure, X
G26 = empty_hole, EMPTY_4
G31 = support_structure, X
G32 = irradiation_tube, IT_3

[openmc]
# Monte Carlo settings
particles = 1000
batches = 3
inactive = 1
# Explicit thread count used by OpenMCRunner; review for the destination computer.
threads = 24
# Keep overlap checking off for this fast lifecycle smoke test.
geometry_debug = false
# keff trigger enabled/disabled
keff_trigger_enabled = false
# keff trigger threshold for stedev 
keff_trigger_stdev_pcm = 50
# minimum interval between trigger evaluations, in batches
trigger_batch_interval = 5
# maximum batches allowed when at least one trigger is active
trigger_max_batches = 3
# enable uncertainty trigger for the fuel-segment fission-q tally
tally_trigger_enabled = false
# supported OpenMC tally trigger: rel_err, std_dev, or variance
tally_trigger_type = rel_err
# dimensionless threshold for rel_err; follows the selected trigger type otherwise
tally_trigger_threshold = 0.10
# false prevents premature success while any tally bin remains unsampled
tally_trigger_ignore_zeros = false
# tally used for pin-wise fission energy / power information
fission_tally_name = fuel_segment_fission_q_recoverable
# tally score consumed by objective and PPF evaluation
fission_tally_score = fission-q-recoverable

[convergence]
# post-transport statistical acceptance gate
enabled = false
# maximum keff standard deviation in pcm; 1 pcm = 1e-5 delta-k/k
max_keff_std_dev_pcm = 50
# maximum accepted aggregate relative standard deviations for positive-mean tally bins
max_tally_mean_relative_std_dev = 0.05
max_tally_p95_relative_std_dev = 0.10
max_tally_max_relative_std_dev = 0.20
# false makes any zero-mean tally bin fail the gate
allow_zero_mean_bins = false

[retry]
# total allowed OpenMC attempts for one individual
max_attempts = 1
# interruption caused by crash/power loss does not consume an attempt
interrupted_counts_as_failed_attempt = false
# campaign behaviour after three actual failed attempts
on_max_attempts = halt_campaign
